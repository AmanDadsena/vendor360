name: vendor360_ui
description: Vendor360 design system — tokens, theme, motion and components.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.0

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Anek, by Ek Type (Mumbai) — the product's voice from here on. One
    # design in two scripts, so Hindi and Marathi carry the same letterforms
    # as English instead of borrowing a stranger's. Both files are variable
    # on weight (100-800) and width (75-125); the narrow widths are what set
    # figures the way a pack prints its MRP. Anek Devanagari also carries
    # full Latin, which is why it can stand behind Anek Latin as the fallback.
    #
    # SIL Open Font License 1.1 — see assets/fonts/OFL-Anek.txt.
    - family: AnekLatin
      fonts:
        - asset: assets/fonts/AnekLatin-Variable.ttf
    - family: AnekDevanagari
      fonts:
        - asset: assets/fonts/AnekDevanagari-Variable.ttf
