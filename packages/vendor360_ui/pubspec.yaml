name: vendor360_ui
description: Vendor360 design system — tokens, theme, motion and components.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

    # Devanagari, for Hindi and Marathi. Inter has no Devanagari coverage, so
    # without this every vernacular string renders as tofu — and `hi` is the
    # product's default language. Bundled rather than relied on from the
    # platform because `TextStyle.package` prefixes every `fontFamilyFallback`
    # entry with `packages/vendor360_ui/`, so a system font name in that list
    # silently resolves to nothing.
    #
    # SIL Open Font License 1.1 — see assets/fonts/OFL-NotoSansDevanagari.txt.
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Variable.ttf
